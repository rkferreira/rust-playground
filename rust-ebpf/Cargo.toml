[workspace]
members = [
    "hello-ebpf",
    "hello-ebpf-common",
    "hello-ebpf-ebpf",
    "xtask",
]
resolver = "2"

[workspace.dependencies]
aya = "0.13"
aya-log = "0.2"
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1.38", features = ["macros", "rt", "rt-multi-thread", "net", "signal"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
libc = "0.2"

