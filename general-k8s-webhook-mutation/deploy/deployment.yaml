apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-mutation-controller
  namespace: default
  labels:
    app.kubernetes.io/name: general-k8s-webhook-mutation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: general-k8s-webhook-mutation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: general-k8s-webhook-mutation
    spec:
      serviceAccountName: webhook-mutation-sa
      containers:
        - name: webhook
          image: general-k8s-webhook-mutation:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RUST_LOG
              value: "info,general_k8s_webhook_mutation=debug"
            - name: PORT
              value: "8443"
            - name: WEBHOOK_CONFIG_NAME
              value: "webhook-mutation-rules"
            - name: SERVICE_NAME
              value: "webhook-mutation-service"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SELF_BOOTSTRAP_TLS
              value: "true"
          ports:
            - name: https
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
