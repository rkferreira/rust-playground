apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-mutation-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-mutation-role
rules:
  # Permissions to watch and update MutationRule CRDs and statuses
  - apiGroups: ["mutation.webhook.io"]
    resources: ["mutationrules"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["mutation.webhook.io"]
    resources: ["mutationrules/status", "mutationrules/finalizers"]
    verbs: ["get", "patch", "update"]
  # Permission to patch caBundle in MutatingWebhookConfiguration
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-mutation-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webhook-mutation-role
subjects:
  - kind: ServiceAccount
    name: webhook-mutation-sa
    namespace: default
